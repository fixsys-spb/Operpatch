name: Remark-lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install remark-cli and preset
        run: npm install --no-save remark-cli remark-preset-lint-recommended

      - name: Create remark config
        run: |
          cat > .remarkrc.json << 'EOF'
          {
            "plugins": [
              "remark-preset-lint-recommended"
            ]
          }
          EOF

      - name: Run remark-lint
        run: npx remark CHANGELOG.md CHANGELOG.ru.md README.md README.ru.md --frail